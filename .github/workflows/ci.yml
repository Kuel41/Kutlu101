name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# GitHub Actions Node.js 20 deprecated uyarısını (actions/checkout@v4 vs. için) gidermeye / sessize almaya yardımcı ortam değişkeni
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: 24.x
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Run Lint
      run: npm run lint
      
    - name: Build
      run: npm run build
      
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: dist/
