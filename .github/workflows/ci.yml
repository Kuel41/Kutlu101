name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Node.js 20 deprecation uyarısını kökten çözmek için aksiyonların v7 sürümleri kullanılıyor
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Setup Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24.x
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci
      
    - name: Run Lint
      run: npm run lint
      
    - name: Build
      run: npm run build
      
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: build-output
        path: dist/
